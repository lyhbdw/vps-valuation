<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS 剩余价值计算器</title>
    <meta name="description" content="VPS 剩余价值计算器：输入续费价格、付款周期与到期日，实时算出剩余价值、剩余天数与转让溢价，支持多币种、自定义汇率与分享图生成。">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta property="og:type" content="website">
    <meta property="og:title" content="VPS 剩余价值计算器">
    <meta property="og:description" content="算算你的 VPS 还值多少钱：剩余价值、剩余天数、转让溢价一键搞定。">
    <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Cpath d='M32 14L16 46h32L32 14z' fill='%23ffffff'/%3E%3C/svg%3E">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Cpath d='M32 14L16 46h32L32 14z' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://open.er-api.com" crossorigin>
    <link rel="dns-prefetch" href="https://open.er-api.com">
    <script>
        (() => {
            try {
                const savedTheme = localStorage.theme;
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.classList.toggle('dark', savedTheme === 'dark' || (!savedTheme && prefersDark));
            } catch (err) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        .app-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#ffffff;transition:opacity 120ms ease,visibility 120ms ease}
        html.dark .app-loader{background:#000000}
        .app-loader.is-hidden{visibility:hidden;opacity:0;pointer-events:none}
        .app-loader__dot{width:18px;height:18px;border:2px solid rgba(0,0,0,.15);border-top-color:#000000;border-radius:9999px;animation:app-loader-spin 600ms linear infinite}
        html.dark .app-loader__dot{border-color:rgba(255,255,255,.2);border-top-color:#ffffff}
        @keyframes app-loader-spin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.app-loader{transition:none}.app-loader__dot{animation:none}}
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start md:justify-center px-3 pb-6 pt-6 md:px-4 md:py-8 text-neutral-900 dark:text-neutral-100 font-sans">

    <div id="appLoader" class="app-loader" role="status" aria-label="页面加载中">
        <span class="app-loader__dot" aria-hidden="true"></span>
    </div>

    <main id="captureRoot" class="w-full max-w-4xl relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-3.5 px-1">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-md bg-black dark:bg-white flex items-center justify-center text-white dark:text-black shrink-0 shadow-sm">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 19.5h20L12 2z"/>
                    </svg>
                </div>
                <h1 class="text-base md:text-lg font-semibold tracking-tight text-neutral-900 dark:text-white flex items-center gap-2 leading-none">
                    <span>VPS 剩余价值</span>
                    <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded border border-neutral-200 dark:border-neutral-800 text-neutral-500 dark:text-neutral-400 font-medium">Bento</span>
                </h1>
            </div>
            
            <button id="themeToggle" type="button" aria-label="切换深色/浅色模式" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none" title="切换深色/浅色模式">
                <span id="themeToggleKnob" class="h-4 w-4 rounded-full bg-white dark:bg-neutral-100 shadow flex items-center justify-center">
                    <!-- Moon Icon -->
                    <svg class="w-2.5 h-2.5 text-neutral-800 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <!-- Sun Icon -->
                    <svg class="w-2.5 h-2.5 text-neutral-800 dark:hidden" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1a1 1 0 011 1v1a1 1 0 11-2 0V2a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm3 2a1 1 0 100 2h1a1 1 0 100-2h-1zM10 15a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.6 5.6a1 1 0 011.4 0l.7.7a1 1 0 11-1.4 1.5l-.7-.8a1 1 0 010-1.4zm9.9 9.9a1 1 0 00-1.4 0l-.7.7a1 1 0 101.4 1.5l.7-.8a1 1 0 000-1.4zM3 9a1 1 0 100 2H2a1 1 0 100-2h1z"/></svg>
                </span>
            </button>
        </div>

        <!-- Main Card Bento Grid -->
        <div id="mainCard" class="relative rounded-xl overflow-hidden flex flex-col md:flex-row transition-all duration-200 border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-[#0a0a0a]">
            
            <!-- Left Input Section (Bento Form) -->
            <section class="w-full md:w-[57%] p-3.5 md:p-6 border-b md:border-b-0 md:border-r border-neutral-200 dark:border-neutral-800 bg-neutral-50/60 dark:bg-[#0e0e0e] transition-colors">
                <form id="calcForm" class="space-y-3 md:space-y-3.5">
                    
                    <!-- Bento Tile 1: 续费价格 & 币种 -->
                    <div class="bento-tile p-3 md:p-3.5 flex flex-row gap-3">
                        <div class="w-1/2">
                            <div class="flex justify-between items-center mb-1.5 h-4">
                                <label for="price" class="text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold leading-none transition-colors flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-neutral-400 dark:text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                    续费价格
                                </label>
                                <span id="priceCNYPreview" class="text-[11px] font-mono text-neutral-400 dark:text-neutral-500 font-medium leading-none whitespace-nowrap">≈0.00元</span>
                            </div>
                            <div class="relative">
                                <span class="symbol-display absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 dark:text-neutral-500 font-mono text-sm md:text-base pointer-events-none">$</span>
                                <input type="number" id="price" step="any" 
                                    class="w-full h-9 md:h-10 pl-7 md:pl-8 pr-2.5 rounded-md text-sm md:text-base font-mono font-medium outline-none transition-all" 
                                    placeholder="0.00">
                            </div>
                        </div>

                        <div class="w-1/2">
                            <div class="flex justify-between items-center mb-1.5 h-4">
                                <label for="currency" class="text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold leading-none transition-colors flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-neutral-400 dark:text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H8"/></svg>
                                    结算币种
                                </label>
                            </div>
                            <div class="relative">
                                <select id="currency" 
                                    class="w-full h-9 md:h-10 pl-3 pr-7 rounded-md text-xs md:text-sm font-medium cursor-pointer appearance-none outline-none transition-all">
                                    <option value="CNY">CNY 人民币</option>
                                    <option value="USD" selected>USD 美元</option>
                                    <option value="EUR">EUR 欧元</option>
                                    <option value="GBP">GBP 英镑</option>
                                    <option value="JPY">JPY 日元</option>
                                    <option value="KRW">KRW 韩元</option>
                                    <option value="AUD">AUD 澳元</option>
                                    <option value="HKD">HKD 港元</option>
                                    <option value="TWD">TWD 新台币</option>
                                    <option value="CAD">CAD 加拿大元</option>
                                    <option value="SGD">SGD 新加坡元</option>
                                </select>
                                <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-400 dark:text-neutral-500">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bento Tile 2: 付款周期选择 -->
                    <fieldset class="bento-tile p-3 md:p-3.5 m-0 border-0">
                        <legend class="text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold mb-2 flex items-center gap-1.5 leading-none">
                            <svg class="w-3.5 h-3.5 text-neutral-400 dark:text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            付款周期
                        </legend>
                        <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="30" class="cycle-radio sr-only"><div class="cycle-option">月付</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="90" class="cycle-radio sr-only"><div class="cycle-option">季付</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="180" class="cycle-radio sr-only"><div class="cycle-option">半年</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="365" class="cycle-radio sr-only" checked><div class="cycle-option">年付</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="730" class="cycle-radio sr-only"><div class="cycle-option">两年</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="1095" class="cycle-radio sr-only"><div class="cycle-option">三年</div></label>
                        </div>
                    </fieldset>

                    <!-- Bento Tile 3: 到期与交易日期 -->
                    <div class="bento-tile p-3 md:p-3.5 flex flex-row gap-3">
                        <div class="w-1/2 min-w-0">
                            <label for="dueDate" class="text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold mb-1.5 flex items-center gap-1.5 leading-none">
                                <svg class="w-3.5 h-3.5 text-neutral-400 dark:text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                到期日期
                            </label>
                            <div class="relative date-input-wrapper">
                                <input type="date" id="dueDate" class="date-native-input">
                                <span class="date-display-value text-xs md:text-sm font-mono font-medium" aria-hidden="true"></span>
                                <span class="date-input-icon absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center justify-center text-neutral-400 dark:text-neutral-500 pointer-events-none" aria-hidden="true">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 2v4m8-4v4M3 10h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
                                </span>
                            </div>
                        </div>
                        <div class="w-1/2 min-w-0">
                            <label for="tradeDate" class="text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold mb-1.5 flex items-center gap-1.5 leading-none">
                                <svg class="w-3.5 h-3.5 text-neutral-400 dark:text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                                交易日期
                            </label>
                            <div class="relative date-input-wrapper">
                                <input type="date" id="tradeDate" class="date-native-input">
                                <span class="date-display-value text-xs md:text-sm font-mono font-medium" aria-hidden="true"></span>
                                <span class="date-input-icon absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center justify-center text-neutral-400 dark:text-neutral-500 pointer-events-none" aria-hidden="true">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 2v4m8-4v4M3 10h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Bento Tile 4: 实时汇率条 -->
                    <div class="flex items-center justify-between gap-2 px-1 pt-1.5 border-t border-neutral-200/80 dark:border-neutral-800/80">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>
                            <label for="customRate" class="text-[11px] font-mono text-neutral-500 dark:text-neutral-400 uppercase tracking-wider font-semibold whitespace-nowrap shrink-0">
                                CNY 汇率
                            </label>
                            <input type="number" id="customRate" step="0.0001" class="w-16 md:w-20 text-xs font-mono font-semibold border-b bg-transparent outline-none py-0.5 text-center shrink-0" placeholder="0.00">
                        </div>
                        
                        <div class="flex items-center gap-2 relative shrink-0">
                            <div id="rateLimitTip" role="alert" class="rate-limit-tip px-2 py-1 text-[11px] rounded shadow-sm whitespace-nowrap">
                                请勿频繁刷新
                            </div>
                            <button type="button" id="refreshRateBtn" aria-label="刷新汇率" title="刷新汇率" class="text-[11px] font-mono text-neutral-500 hover:text-black dark:hover:text-white transition-colors flex items-center gap-1 whitespace-nowrap shrink-0">
                                <span id="apiRateDisplay" class="hidden sm:inline">刷新</span>
                                <svg id="refreshIcon" class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            </button>
                            <span class="text-neutral-300 dark:text-neutral-700">·</span>
                            <a href="https://www.exchangerate-api.com" target="_blank" class="text-[11px] font-mono text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 transition-colors no-underline whitespace-nowrap shrink-0">来源</a>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Right Result Section (Bento Showcase) -->
            <section id="resultCard" class="w-full md:w-[43%] bg-white dark:bg-[#0a0a0a] p-3.5 md:p-6 flex flex-col justify-between relative transition-colors">
                
                <div class="result-summary relative z-10 w-full min-w-0 flex-1 flex flex-col justify-between">
                    
                    <!-- Bento Hero: 剩余价值大卡片 -->
                    <div class="result-value-panel bento-tile p-3.5 md:p-4 mb-2.5 md:mb-3">
                        <div class="w-full flex items-center justify-between mb-2">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-neutral-900 dark:bg-white shrink-0"></span>
                                <h2 class="text-[10px] md:text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold leading-none">
                                    剩余价值 / RESIDUAL
                                </h2>
                            </div>
                            <div id="originalCurrencyValue" class="text-[11px] font-mono text-neutral-400 dark:text-neutral-500 font-medium leading-none whitespace-nowrap">
                                ≈0.00 USD
                            </div>
                        </div>
                        
                        <div class="result-amount-row flex items-baseline justify-end gap-1">
                            <span class="text-xl md:text-2xl text-neutral-400 dark:text-neutral-600 font-mono font-light select-none">¥</span>
                            <span id="finalValue" role="button" tabindex="0" title="点击复制金额" aria-label="点击复制金额" class="text-4xl md:text-5xl lg:text-[54px] font-mono font-bold tracking-tighter leading-none select-all focus-visible:outline-none">0.00</span>
                        </div>
                        
                        <div class="amount-copy-row mt-2 flex items-center justify-end leading-none">
                            <span id="amountCopyTip" class="amount-copy-tip rounded px-2 py-0.5 text-[10px] font-mono leading-none">已复制金额</span>
                        </div>
                    </div>

                    <!-- Bento Tile: 剩余时间与进度 -->
                    <div class="result-days-panel bento-tile p-3 md:p-3.5 mb-2.5 md:mb-3">
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="text-[10px] md:text-[11px] font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400 font-semibold flex items-center gap-1.5 leading-none">
                                <svg class="w-3 h-3 text-neutral-400 dark:text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 10"/></svg>
                                剩余天数
                            </div>
                            <div class="days-count-line text-xs md:text-sm font-mono font-semibold text-neutral-800 dark:text-neutral-200 leading-none">
                                <span id="daysRemaining">0</span> <span class="text-[10px] text-neutral-400 dark:text-neutral-500 uppercase ml-0.5">DAYS</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <div class="flex-1 progress-container">
                                <div id="progressBar" class="progress-fill w-0"></div>
                            </div>
                            <span id="progressText" class="text-[10px] md:text-[11px] font-mono font-semibold text-neutral-600 dark:text-neutral-400 shrink-0 leading-none">0%</span>
                        </div>
                    </div>

                    <!-- Bento Tile: 溢价与转让总价 -->
                    <div class="quote-panel bento-tile p-3 md:p-3.5 grid grid-cols-2 gap-3 mb-2.5 md:mb-3">
                        <div class="quote-field min-w-0">
                            <label for="premiumInput" class="quote-label mb-1">
                                <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                溢价 (CNY)
                            </label>
                            <div class="quote-input-wrap relative">
                                <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs font-mono text-neutral-400 pointer-events-none">¥</span>
                                <input type="number" id="premiumInput" step="0.01" class="quote-input" placeholder="0.00" inputmode="decimal">
                            </div>
                        </div>
                        <div class="quote-field min-w-0">
                            <label for="salePriceInput" class="quote-label mb-1">
                                <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="7" x2="18" y2="7"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="10" y1="17" x2="14" y2="17"/></svg>
                                总价 (CNY)
                            </label>
                            <div class="quote-input-wrap relative">
                                <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs font-mono text-neutral-400 pointer-events-none">¥</span>
                                <input type="number" id="salePriceInput" step="0.01" class="quote-input" placeholder="0.00" inputmode="decimal">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Bar -->
                <div id="btnContainer" class="action-bar relative z-10 mt-2">
                    <button type="button" id="copyBtn" title="复制Markdown格式详情" class="action-btn">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span>复制文本</span>
                    </button>
                    <button type="button" id="imgBtn" title="生成分享图片" class="action-btn">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>生成图片</span>
                    </button>
                </div>
                
                <div id="toast" class="absolute bottom-16 left-1/2 -translate-x-1/2 text-xs font-mono font-semibold px-3 py-1.5 rounded pointer-events-none z-20">已复制到剪贴板</div>
            </section>
        </div>

        <div id="footerWrap" class="mt-3 text-center">
            <span class="text-[11px] font-mono text-neutral-400 dark:text-neutral-600 transition-colors">VPS 剩余价值计算器 · v1.0.0</span>
        </div>

    </main>

    <!-- Image Export Modal -->
    <div id="imageModal" role="dialog" aria-modal="true" aria-label="生成的分享图片" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 transition-all duration-200 opacity-0">
        <div class="relative w-full max-w-4xl flex flex-col items-center">
            <button type="button" id="closeImageModalBtn" aria-label="关闭预览" class="absolute -top-11 right-0 text-white/70 hover:text-white transition-colors p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div id="modalLoading" class="text-white flex flex-col items-center gap-3">
                <svg class="animate-spin h-7 w-7 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-sm font-mono text-neutral-300">Generating preview...</span>
            </div>

            <img id="generatedImage" class="w-full h-auto rounded-lg shadow-2xl border border-neutral-700 hidden" alt="Result Preview">
            
            <div id="modalActions" class="mt-5 flex flex-col sm:flex-row items-center justify-center gap-3 hidden">
                <a id="downloadImageBtn" href="#" download="vps-value.webp" class="inline-flex items-center gap-1.5 rounded-md bg-white px-4 py-2 text-xs md:text-sm font-semibold text-black transition-colors hover:bg-neutral-200 focus-visible:outline-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"></path></svg>
                    下载图片
                </a>
                <p class="text-neutral-400 text-xs font-mono flex items-center">
                    <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    长按或右键另存图片
                </p>
            </div>
        </div>
    </div>
